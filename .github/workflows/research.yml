name: Deep research runner

# Drains the deep-research queue (research_jobs) on a schedule: for each
# escalated account, runs deep research + re-map + re-score. Runs the CLI on
# the Actions runner (no serverless timeout), draining the whole queue per pass.
# The manual on-demand path is the POST /api/research endpoint in the app.

on:
  schedule:
    - cron: "0 */6 * * *" # every 6 hours (UTC)
  workflow_dispatch:
    inputs:
      limit:
        description: "Max jobs to process this run"
        required: false
        default: "50"

# Never overlap runs. The library also holds a Postgres advisory lock, so this
# is belt-and-suspenders; cancel-in-progress:false lets an in-flight drain finish.
concurrency:
  group: research-runner
  cancel-in-progress: false

jobs:
  drain:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Drain research queue
        run: npm run research -- --limit "${{ github.event.inputs.limit || '50' }}"
        env:
          # Required — the runner and its deep providers.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          PDL_API_KEY: ${{ secrets.PDL_API_KEY }}
          # Optional — providers skip gracefully when their key is absent.
          IPINFO_TOKEN: ${{ secrets.IPINFO_TOKEN }}
          CENSYS_PAT: ${{ secrets.CENSYS_PAT }}
          CENSYS_ORG_ID: ${{ secrets.CENSYS_ORG_ID }}
          BUILTWITH_API_KEY: ${{ secrets.BUILTWITH_API_KEY }}
